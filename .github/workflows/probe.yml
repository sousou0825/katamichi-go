name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s https://www.cloudflare.com/cdn-cgi/trace | grep -E '^(ip|loc)=' | sed 's/^ip=.*/ip=(hidden)/'
          curl -s -o page.html -w "status=%{http_code} size=%{size_download}\n" -A "Mozilla/5.0" https://cp.toyota.jp/rentacar/
          grep -c '<li class="service-item"' page.html || true
